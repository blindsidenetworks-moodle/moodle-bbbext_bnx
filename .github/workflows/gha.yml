name: Moodle Plugin CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3']
        runchecks: ['all']
        moodle-branch: ['MOODLE_501_STABLE', 'MOODLE_502_STABLE', 'main']
        database: ['mariadb', 'pgsql']

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Start MariaDB
        if: ${{ matrix.database == 'mariadb' }}
        run: |
          docker run --rm \
            -e MARIADB_DATABASE=test \
            -e MARIADB_USER=test \
            -e MARIADB_PASSWORD=test \
            -e MARIADB_ALLOW_EMPTY_ROOT_PASSWORD=true \
            -p 3306:3306 \
            -d \
            --tmpfs /var/lib/mysql:rw,noexec,nosuid,size=1024M \
            mariadb:11 \
              --character-set-server=utf8mb4 \
              --collation-server=utf8mb4_unicode_ci

      - name: Wait for MariaDB
        if: ${{ matrix.database == 'mariadb' }}
        run: |
          container_id=$(docker ps -q --filter ancestor=mariadb:11 | head -n1)
          until docker exec "$container_id" mariadb-admin ping -h127.0.0.1 -uroot --silent; do
            sleep 2
          done

      - name: Start PostgreSQL
        if: ${{ matrix.database == 'pgsql' }}
        run: |
          docker run --rm \
            -e POSTGRES_DB=test \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 5432:5432 \
            -d \
            --tmpfs /var/lib/postgresql/data:rw,noexec,nosuid,size=1024M \
            postgres:17

      - name: Wait for PostgreSQL
        if: ${{ matrix.database == 'pgsql' }}
        run: |
          container_id=$(docker ps -q --filter ancestor=postgres:17 | head -n1)
          until docker exec "$container_id" pg_isready -U postgres; do
            sleep 2
          done

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ matrix.extensions }}
          ini-values: max_input_vars=5000
          # If you are not using code coverage, keep "none". Otherwise, use "pcov" (Moodle 3.10 and up) or "xdebug".
          # If you try to use code coverage with "none", it will fallback to phpdbg (which has known problems).
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install moodle-plugin-ci
        run: |
          moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        if: ${{ !cancelled() && matrix.runchecks == 'all' }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true # This step will show errors but will not fail
        if: ${{ !cancelled() && matrix.runchecks == 'all' }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        if: ${{ !cancelled() && matrix.runchecks == 'all' }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() && matrix.runchecks == 'all' }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() && matrix.runchecks == 'all' }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ !cancelled() && matrix.runchecks == 'all' }}
        run: moodle-plugin-ci mustache

      - name: Grunt
        if: ${{ !cancelled() && matrix.runchecks == 'all' }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Behat features
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci behat --profile chrome

      - name: Mark cancelled jobs as failed.
        if: ${{ cancelled() }}
        run: exit 1
